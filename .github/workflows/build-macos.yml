name: Build Gleec Wallet macOS

run-name: "macOS ${{ inputs.stage }} (by @${{ github.actor }})"

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Last implemented stage to run"
        required: true
        type: choice
        options:
          - diagnostics
          - toolchain
          - source
          - prepare
          - signing
          - build
          - notary-auth
          - notarize
          - dmg
          - dmg-check
        default: diagnostics
      ref:
        description: "gleec-wallet ref to build (commit SHA, branch, or tag)"
        required: true
        default: main
      build_type:
        description: "Service configuration and eventual release tag prefix"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: read

concurrency:
  group: gleec-macos-runner
  cancel-in-progress: false

jobs:
  build_macos:
    name: macOS ${{ inputs.stage }}
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'DeckerSU/gleec-wallet-builder' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    environment: macos-signing
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      COCOAPODS_DISABLE_STATS: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      FLUTTER_VERSION: "3.41.4"
      # Official releases_macos.json: version, arm64 archive checksum and git revision.
      FLUTTER_ARCHIVE_SHA256: "16984a0dae1f13c7b3e05b973913a939144b7e9e3aa6439fa3382599a6326f8c"
      FLUTTER_REVISION: "ff37bef603469fb030f2b72995ab929ccfc227f0"
      WALLET_DIR: ${{ github.workspace }}/wallet-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # No checkout or secrets: inspect the actual service environment first.
      - name: Verify runner platform
        run: |
          {
            echo '## macOS runner diagnostics'
            printf '\nRunner: `%s`\n' "$RUNNER_NAME"
            printf '\nWorkflow commit: `%s`\n' "$GITHUB_SHA"
            printf '\nPlatform: `%s / %s`\n' "$RUNNER_OS" "$RUNNER_ARCH"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64

      - name: Require Finder automation for DMG packaging
        if: contains(fromJSON('["dmg","dmg-check"]'), inputs.stage)
        timeout-minutes: 2
        run: |
          test "$(id -u)" = "$(stat -f '%u' /dev/console)" || {
            echo '::error::The runner user must have an active macOS console session for Finder packaging.'
            exit 1
          }
          launchctl print "gui/$(id -u)" >/dev/null
          osascript -e 'tell application "Finder" to get version'

      - name: Check Finder layout on a small temporary image
        if: inputs.stage == 'dmg-check'
        timeout-minutes: 3
        run: |
          umask 022
          PACKAGING_DIR=$(mktemp -d /private/tmp/gleec-dmg.XXXXXXXX)
          export PACKAGING_DIR
          printf 'PACKAGING_DIR=%s\n' "$PACKAGING_DIR" >> "$GITHUB_ENV"
          hdiutil create -size 32m -fs HFS+J -volname "Gleec Packaging Check" "$PACKAGING_DIR/probe.dmg"
          mkdir -p "$PACKAGING_DIR/mnt"
          hdiutil attach "$PACKAGING_DIR/probe.dmg" -readwrite -nobrowse -noautoopen -mountpoint "$PACKAGING_DIR/mnt"
          mkdir -p "$PACKAGING_DIR/mnt/Sample.app"
          ln -s /Applications "$PACKAGING_DIR/mnt/Applications"
          osascript - "$PACKAGING_DIR/mnt" <<'APPLESCRIPT'
          on run argv
            set mpPOSIX to item 1 of argv
            log "Resolving the mountpoint outside Finder"
            set mp to (POSIX file mpPOSIX) as alias
            log "Mountpoint resolved; requesting Finder layout"
            with timeout of 30 seconds
              tell application "Finder"
                activate
                open mp
                delay 1
                set w to window 1
                set target of w to mp
                set current view of w to icon view
                set toolbar visible of w to false
                set statusbar visible of w to false
                set bounds of w to {100, 100, 630, 500}
                set icon size of icon view options of w to 128
                set position of item "Sample.app" of (folder mp) to {120, 200}
                set position of item "Applications" of (folder mp) to {400, 200}
                close w
              end tell
            end timeout
            log "Finder layout completed"
          end run
          APPLESCRIPT
          hdiutil detach "$PACKAGING_DIR/mnt"
          echo 'Finder resolved the temporary mountpoint and completed the requested icon layout.' >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect installed tools
        run: |
          # Missing tools are findings, not failures of this inventory stage.
          # Bound each probe so an interactive first launch cannot hang the job.
          probe() {
            local label="$1"
            shift
            printf '\n### %s\n\n```text\n' "$label"
            if command -v "$1" >/dev/null 2>&1; then
              local result=0
              /usr/bin/perl -e 'alarm 60; exec @ARGV or die "exec failed: $!\n"' -- "$@" 2>&1 || result=$?
              printf '\nProbe exit code: %s\n' "$result"
            else
              printf 'MISSING: %s\n' "$1"
            fi
            printf '```\n'
          }

          {
            probe 'macOS version' sw_vers
            probe 'Architecture' uname -m
            probe 'Free space (workspace)' df -h "$GITHUB_WORKSPACE"
            probe 'Free space (temporary directory)' df -h "$RUNNER_TEMP"
            probe 'Selected developer directory' xcode-select -p
            probe 'Xcode version' xcodebuild -version
            probe 'Xcode first-launch status' xcodebuild -checkFirstLaunchStatus
            probe 'macOS SDK version' xcrun --sdk macosx --show-sdk-version
            probe 'macOS SDK path' xcrun --sdk macosx --show-sdk-path
            probe 'notarytool' xcrun notarytool --version
            probe 'stapler location' xcrun --find stapler
            probe 'Git' git --version
            probe 'Homebrew' brew --version
            probe 'Flutter' flutter --version
            probe 'Dart' dart --version
            probe 'Ruby' ruby --version
            probe 'Bundler' bundle --version
            probe 'CocoaPods' pod --version
            probe 'CMake' cmake --version
            probe 'Ninja' ninja --version
            probe 'Rust' rustc --version
            probe 'Python' python3 --version
            printf '\n### Apple utilities\n\n```text\n'
            for tool in codesign security hdiutil ditto osascript file lipo otool; do
              command -v "$tool" || printf 'MISSING: %s\n' "$tool"
            done
            printf '```\n\n### Installed Xcode applications\n\n```text\n'
            for app in /Applications/Xcode*.app; do
              if [ -d "$app" ]; then
                printf '%s\n' "$app"
              fi
            done
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Flutter from the official archive
        if: inputs.stage != 'diagnostics' && inputs.stage != 'dmg-check'
        timeout-minutes: 20
        run: |
          FLUTTER_INSTALL_DIR=$(mktemp -d "$RUNNER_TEMP/gleec-flutter.XXXXXXXX")
          printf 'FLUTTER_INSTALL_DIR=%s\n' "$FLUTTER_INSTALL_DIR" >> "$GITHUB_ENV"
          ARCHIVE="$FLUTTER_INSTALL_DIR/flutter.zip"
          ARCHIVE_URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          echo "Downloading Flutter $FLUTTER_VERSION (macOS arm64) from the official release archive."
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 --connect-timeout 30 --max-time 900 \
            "$ARCHIVE_URL" --output "$ARCHIVE"
          printf '%s  %s\n' "$FLUTTER_ARCHIVE_SHA256" "$ARCHIVE" | shasum -a 256 --check -
          ditto -x -k "$ARCHIVE" "$FLUTTER_INSTALL_DIR"
          rm -f "$ARCHIVE"
          FLUTTER_ROOT="$FLUTTER_INSTALL_DIR/flutter"
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = "$FLUTTER_REVISION"
          test -x "$FLUTTER_ROOT/bin/flutter"
          printf 'FLUTTER_ROOT=%s\n' "$FLUTTER_ROOT" >> "$GITHUB_ENV"
          printf '%s\n' "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          {
            echo '### Flutter archive verification'
            printf '\nVersion: `%s` (macOS arm64)\n' "$FLUTTER_VERSION"
            printf '\nSHA-256: `%s` — verified before extraction\n' "$FLUTTER_ARCHIVE_SHA256"
            printf '\nSDK revision: `%s` — verified\n' "$FLUTTER_REVISION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Flutter and download macOS and web artifacts
        if: inputs.stage != 'diagnostics' && inputs.stage != 'dmg-check'
        run: |
          flutter --version --machine > "$RUNNER_TEMP/gleec-flutter-version.json"
          python3 - "$RUNNER_TEMP/gleec-flutter-version.json" <<'PY'
          import json
          import os
          import sys
          with open(sys.argv[1]) as source:
              version = json.load(source)
          expected = os.environ['FLUTTER_VERSION']
          if version['frameworkVersion'] != expected:
              raise SystemExit(f"Expected Flutter {expected}, got {version['frameworkVersion']}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"\n### Selected Flutter SDK\n\nFlutter: {expected}\n\n")
              summary.write(f"Dart: {version['dartSdkVersion']}\n")
          PY
          flutter precache --macos --web

      - name: Require full Xcode and working CocoaPods
        if: inputs.stage != 'diagnostics' && inputs.stage != 'dmg-check'
        env:
          REQUESTED_XCODE_PATH: ${{ vars.MACOS_XCODE_PATH }}
        run: |
          XCODE_PATH="${REQUESTED_XCODE_PATH:-/Applications/Xcode.app/Contents/Developer}"
          if [ ! -x "$XCODE_PATH/usr/bin/xcodebuild" ]; then
            echo '::error::Full Xcode is required. Install Xcode.app and complete its first launch on the Mac. For a custom location, set MACOS_XCODE_PATH to its Contents/Developer directory.'
            echo '### Toolchain blocked: full Xcode is not installed at the configured path.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          export DEVELOPER_DIR="$XCODE_PATH"
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -checkFirstLaunchStatus
          xcrun --sdk macosx --show-sdk-version
          xcrun notarytool --version
          xcrun --find stapler
          pod --version
          ruby -r cocoapods -e 'abort "Expected CocoaPods 1.16.2" unless Pod::VERSION == "1.16.2"; puts "CocoaPods Ruby libraries load successfully"'
          flutter doctor -v

      - name: Inspect runner session
        run: |
          {
            echo '### Packaging session prerequisites'
            echo
            RUNNER_UID=$(id -u)
            CONSOLE_UID=$(stat -f '%u' /dev/console)
            if [ "$RUNNER_UID" = "$CONSOLE_UID" ]; then
              echo '- Runner user owns the console session: yes'
            else
              echo '- Runner user owns the console session: no'
            fi
            if launchctl print "gui/$RUNNER_UID" >/dev/null 2>&1; then
              echo '- GUI launchd domain for runner user: available'
            else
              echo '- GUI launchd domain for runner user: unavailable'
            fi
            if pgrep -u "$RUNNER_UID" -x Finder >/dev/null 2>&1; then
              echo '- Finder for runner user: running'
            else
              echo '- Finder for runner user: not running'
            fi
            TRANSLATED=$(sysctl -in sysctl.proc_translated 2>/dev/null || true)
            printf -- '- Rosetta translation: %s\n' "${TRANSLATED:-0 (not reported)}"
            echo
            echo 'Finder automation/TCC and disk-image mounting still require a separate packaging test.'
            echo 'No signing identities, provisioning profiles, or notarization credentials were accessed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout wallet source
        if: inputs.stage == 'source' || inputs.stage == 'prepare' || contains(fromJSON('["signing","build","notarize","dmg"]'), inputs.stage)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GLEECBTC/gleec-wallet
          ref: ${{ inputs.ref }}
          path: wallet-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and pinned submodules
        if: inputs.stage == 'source' || inputs.stage == 'prepare' || contains(fromJSON('["signing","build","notarize","dmg"]'), inputs.stage)
        id: source
        working-directory: ${{ env.WALLET_DIR }}
        env:
          SOURCE_REF: ${{ inputs.ref }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --checkout
          git config fetch.recurseSubmodules on-demand
          git submodule status --recursive > "$RUNNER_TEMP/gleec-submodules.txt"
          cat "$RUNNER_TEMP/gleec-submodules.txt"
          if grep -Eq '^[-+U]' "$RUNNER_TEMP/gleec-submodules.txt"; then
            echo '::error::Submodules do not match the commits pinned in the source tree.'
            exit 1
          fi
          test -z "$(git status --porcelain)"
          COMMIT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          SDK_SHA=$(git -C sdk rev-parse HEAD)
          if git show-ref --verify --quiet "refs/tags/$SOURCE_REF"; then
            SAFE_ID=$(python3 -c 'import os,re; print(re.sub(r"[/\\:*?\"<>|~^\s]", "-", os.environ["SOURCE_REF"]))')
          else
            SAFE_ID="$SHORT_SHA"
          fi
          {
            printf 'commit_sha=%s\n' "$COMMIT_SHA"
            printf 'short_sha=%s\n' "$SHORT_SHA"
            printf 'sdk_sha=%s\n' "$SDK_SHA"
            printf 'safe_id=%s\n' "$SAFE_ID"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Verified source'
            printf '\nWallet commit: `%s`\n' "$COMMIT_SHA"
            printf '\nSDK commit: `%s`\n' "$SDK_SHA"
            printf '\nBuild type: `%s`\n' "$BUILD_TYPE"
            printf '\nRelease identifier: `%s_%s`\n' "$BUILD_TYPE" "$SAFE_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply Firebase production config patch
        if: inputs.stage == 'source' || inputs.stage == 'prepare' || contains(fromJSON('["signing","build","notarize","dmg"]'), inputs.stage)
        working-directory: ${{ env.WALLET_DIR }}
        env:
          FIREBASE_PATCH: ${{ secrets.FIREBASE_PATCH }}
        run: |
          test -n "$FIREBASE_PATCH" || { echo '::error::FIREBASE_PATCH is not set'; exit 1; }
          umask 077
          PATCH_FILE=$(mktemp "$RUNNER_TEMP/gleec-firebase.XXXXXXXX")
          trap 'rm -f "$PATCH_FILE"' EXIT
          printf '%s\n' "$FIREBASE_PATCH" > "$PATCH_FILE"
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          test -s macos/Runner/GoogleService-Info.plist
          test -s lib/firebase_options.dart
          echo 'Firebase patch applied successfully (contents omitted).' >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch locked Flutter packages
        if: inputs.stage == 'prepare' || contains(fromJSON('["signing","build","notarize","dmg"]'), inputs.stage)
        working-directory: ${{ env.WALLET_DIR }}
        run: |
          flutter clean
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Generate macOS Pods project
        if: inputs.stage == 'prepare' || contains(fromJSON('["signing","build","notarize","dmg"]'), inputs.stage)
        working-directory: ${{ env.WALLET_DIR }}/macos
        run: |
          pod deintegrate
          # Refresh spec metadata while retaining locked dependency versions.
          pod install --repo-update
          git show HEAD:macos/Podfile.lock > "$RUNNER_TEMP/gleec-Podfile.lock"
          ruby -r cocoapods <<'RUBY'
          original = Pod::Lockfile.from_file(Pathname.new(ENV.fetch('RUNNER_TEMP')).join('gleec-Podfile.lock')).to_hash
          current = Pod::Lockfile.from_file(Pathname.new('Podfile.lock')).to_hash
          original_checksums = original.fetch('SPEC CHECKSUMS')
          current_checksums = current.fetch('SPEC CHECKSUMS')
          changed = (original_checksums.keys | current_checksums.keys).select do |name|
            original_checksums[name] != current_checksums[name]
          end
          local_sources = original.fetch('EXTERNAL SOURCES', {})
          changed.each do |name|
            source = local_sources.fetch(name, {})
            path = source[:path]
            unless original_checksums.key?(name) && current_checksums.key?(name) &&
                   path && path.start_with?('Flutter/ephemeral/.symlinks/plugins/')
              abort "Unexpected checksum change for nonlocal pod: #{name}"
            end
            # Dart packages are already verified by pub get --enforce-lockfile.
            original_checksums[name] = current_checksums[name]
          end
          abort 'Pod dependency versions or sources changed' unless original == current
          unless changed.empty?
            message = "Local Flutter podspec checksums refreshed (versions unchanged): #{changed.sort.join(', ')}"
            puts message
            File.open(ENV.fetch('GITHUB_STEP_SUMMARY'), 'a') { |f| f.puts "\n#{message}\n" }
          end
          RUBY

      - name: Generate assets with the web build
        if: inputs.stage == 'prepare' || contains(fromJSON('["signing","build","notarize","dmg"]'), inputs.stage)
        working-directory: ${{ env.WALLET_DIR }}
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GH_API_PUBLIC_READONLY_TOKEN || github.token }}
        run: |
          WEB_LOG=$(mktemp "$RUNNER_TEMP/gleec-web.XXXXXXXX")
          trap 'rm -f "$WEB_LOG"' EXIT
          set +e
          flutter build web --no-pub 2>&1 | tee "$WEB_LOG"
          RESULTS=("${PIPESTATUS[@]}")
          set -e
          test "${RESULTS[1]}" -eq 0
          if [ "${RESULTS[0]}" -ne 0 ]; then
            if grep -Fq 'What: Coin assets were updated.' "$WEB_LOG" &&
               grep -Fq 'Transformer package: komodo_wallet_build_transformer' "$WEB_LOG"; then
              echo 'Transformer updated coin assets; running the required second web build.'
              echo 'Web asset generation required one retry after the transformer updated coin assets.' >> "$GITHUB_STEP_SUMMARY"
              flutter build web --no-pub
            else
              exit "${RESULTS[0]}"
            fi
          fi

      - name: Verify macOS KDF and generated assets
        if: inputs.stage == 'prepare' || contains(fromJSON('["signing","build","notarize","dmg"]'), inputs.stage)
        working-directory: ${{ env.WALLET_DIR }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import unquote, urljoin, urlparse

          package_config = Path('.dart_tool/package_config.json').resolve()
          packages = json.loads(package_config.read_text())['packages']
          package = next(p for p in packages if p['name'] == 'komodo_defi_framework')
          uri = urlparse(urljoin(package_config.as_uri(), package['rootUri']))
          if uri.scheme != 'file':
              raise SystemExit('Expected a local komodo_defi_framework package')
          root = Path(unquote(uri.path))
          config = json.loads((root / 'app_build/build_config.json').read_text())
          for relative in config['coins']['mapped_files']:
              path = root / relative
              if not json.loads(path.read_text()):
                  raise SystemExit(f'Empty generated config: {relative}')
          for relative in config['coins']['mapped_folders']:
              if not any(p.is_file() and p.stat().st_size for p in (root / relative).rglob('*.png')):
                  raise SystemExit(f'Missing generated coin icons: {relative}')
          kdf = root / config['api']['platforms']['macos']['path'] / 'kdf'
          if not kdf.is_file() or not kdf.stat().st_size:
              raise SystemExit('Missing macOS KDF executable')
          subprocess.run(['lipo', str(kdf), '-verify_arch', 'arm64'], check=True)
          architectures = subprocess.check_output(['lipo', str(kdf), '-archs'], text=True).strip()
          subprocess.run(['otool', '-L', str(kdf)], check=True)
          checksum = hashlib.sha256(kdf.read_bytes()).hexdigest()
          dylib = root / 'macos/lib/libkdflib.dylib'
          if dylib.exists():
              subprocess.run(['lipo', str(dylib), '-verify_arch', 'arm64'], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n### Prepared macOS assets\n\n')
              summary.write(f"KDF commit: `{config['api']['api_commit_hash']}`\n\n")
              summary.write(f'KDF architectures: `{architectures}`\n\n')
              summary.write(f'KDF executable SHA-256: `{checksum}`\n\n')
              summary.write(f"Coins commit after generation: `{config['coins']['bundled_coins_repo_commit']}`\n\n")
              summary.write('Required coin configs and icons are present; macOS KDF supports arm64.\n')
          print('macOS KDF architecture and generated coin assets verified.')
          PY

      - name: Install signing identity in a temporary keychain
        if: contains(fromJSON('["signing","build","notary-auth","notarize","dmg"]'), inputs.stage)
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          umask 077
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$PROFILE_BASE64"
          SIGNING_DIR=$(mktemp -d "$RUNNER_TEMP/gleec-signing.XXXXXXXX")
          export SIGNING_DIR
          SIGNING_KEYCHAIN="$SIGNING_DIR/build.keychain-db"
          export SIGNING_KEYCHAIN
          {
            printf 'SIGNING_DIR=%s\n' "$SIGNING_DIR"
            printf 'SIGNING_KEYCHAIN=%s\n' "$SIGNING_KEYCHAIN"
          } >> "$GITHUB_ENV"
          python3 <<'PY'
          import base64, json, os, shlex, subprocess
          from pathlib import Path
          root = Path(os.environ['SIGNING_DIR'])
          for key, name in [('CERTIFICATE_BASE64', 'identity.p12'), ('PROFILE_BASE64', 'profile.provisionprofile')]:
              (root / name).write_bytes(base64.b64decode(os.environ[key], validate=True))
          keychains = shlex.split(subprocess.check_output(['security', 'list-keychains', '-d', 'user'], text=True))
          (root / 'original-keychains.json').write_text(json.dumps(keychains))
          PY
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$SIGNING_DIR/identity.p12" -k "$SIGNING_KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN" >/dev/null
          python3 <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['SIGNING_DIR'])
          previous = json.loads((root / 'original-keychains.json').read_text())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', os.environ['SIGNING_KEYCHAIN'], *previous], check=True)
          PY
          security cms -D -i "$SIGNING_DIR/profile.provisionprofile" > "$SIGNING_DIR/profile.plist"
          python3 <<'PY'
          import hashlib, json, os, plistlib, re, subprocess, uuid
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path(os.environ['SIGNING_DIR'])
          profile = plistlib.loads((root / 'profile.plist').read_bytes())
          team = 'B52ZCS7TMQ'
          bundle = 'com.GleecDEX.wallet'
          expected_name = 'GleecDEX-B52ZCS7TMQ-Provisioning-Profile'
          if profile.get('TeamIdentifier') != [team] or profile.get('Name') != expected_name:
              raise SystemExit('Provisioning profile team/name does not match the production target')
          entitlements = profile['Entitlements']
          app_id = entitlements.get('com.apple.application-identifier', entitlements.get('application-identifier'))
          if app_id != f'{team}.{bundle}':
              raise SystemExit('Provisioning profile bundle identifier does not match')
          expiry = profile['ExpirationDate'].replace(tzinfo=timezone.utc)
          if expiry <= datetime.now(timezone.utc):
              raise SystemExit('Provisioning profile has expired')
          identities = subprocess.check_output(['security', 'find-identity', '-v', '-p', 'codesigning', os.environ['SIGNING_KEYCHAIN']], text=True)
          valid_ids = set(re.findall(r'\b([0-9A-F]{40}) "Developer ID Application:', identities))
          profile_ids = {hashlib.sha1(cert).hexdigest().upper() for cert in profile['DeveloperCertificates']}
          matches = valid_ids & profile_ids
          if len(matches) != 1:
              raise SystemExit('Expected one valid Developer ID Application identity matching the profile')
          identity = matches.pop()
          profile_uuid = str(uuid.UUID(profile['UUID']))
          destination = Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles' / f'{profile_uuid}.provisionprofile'
          content = (root / 'profile.provisionprofile').read_bytes()
          if destination.exists():
              if destination.read_bytes() != content:
                  raise SystemExit('A different provisioning profile already exists at the destination')
          else:
              destination.parent.mkdir(parents=True, exist_ok=True)
              (root / 'created-profile.json').write_text(json.dumps(str(destination)))
              destination.write_bytes(content)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'SIGNING_IDENTITY={identity}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'\n### Signing identity preflight\n\nTeam: `{team}`\n\nBundle: `{bundle}`\n\n')
              summary.write(f'Profile: `{expected_name}`\n\nProfile expires: `{expiry.isoformat()}`\n\n')
              summary.write('A valid Developer ID Application identity matches the installed provisioning profile.\n')
          PY
          rm -f "$SIGNING_DIR/identity.p12"

      - name: Verify noninteractive code signing
        if: contains(fromJSON('["signing","build","notary-auth","notarize","dmg"]'), inputs.stage)
        timeout-minutes: 5
        run: |
          printf 'int main(void) { return 0; }\n' > "$SIGNING_DIR/probe.c"
          xcrun clang -arch arm64 "$SIGNING_DIR/probe.c" -o "$SIGNING_DIR/probe"
          codesign --force --sign "$SIGNING_IDENTITY" --keychain "$SIGNING_KEYCHAIN" \
            --options runtime --timestamp "$SIGNING_DIR/probe"
          codesign --verify --strict --verbose=2 "$SIGNING_DIR/probe"
          codesign --display --verbose=4 "$SIGNING_DIR/probe"
          echo 'Developer ID test signature verified without an interactive keychain prompt.' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Apple notarization credentials
        if: contains(fromJSON('["notary-auth","notarize","dmg"]'), inputs.stage)
        timeout-minutes: 5
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool store-credentials AC_NOTARY_GLEEC \
            --apple-id "$APPLE_ID" --team-id B52ZCS7TMQ \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$SIGNING_KEYCHAIN"
          echo 'Apple notarization credentials validated; profile AC_NOTARY_GLEEC is stored only in the temporary keychain.' >> "$GITHUB_STEP_SUMMARY"

      - name: Harden the legacy KDF helper signing phase
        if: contains(fromJSON('["build","notarize","dmg"]'), inputs.stage)
        working-directory: ${{ env.WALLET_DIR }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          project = Path('macos/Runner.xcodeproj/project.pbxproj')
          content = project.read_text()
          old = r'/usr/bin/codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \"$KDF_HELPER\"'
          new = r'/usr/bin/codesign --force --options runtime --timestamp --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \"$KDF_HELPER\"'
          if old in content:
              if content.count(old) != 1:
                  raise SystemExit('Ambiguous legacy KDF signing phase')
              project.write_text(content.replace(old, new))
              print('Enabled hardened runtime and timestamp for the KDF helper signing phase.')
          else:
              print('No legacy KDF signing invocation found; final binary signature checks remain required.')
          PY

      - name: Build signed macOS application
        if: contains(fromJSON('["build","notarize","dmg"]'), inputs.stage)
        timeout-minutes: 45
        working-directory: ${{ env.WALLET_DIR }}
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GH_API_PUBLIC_READONLY_TOKEN || github.token }}
          FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_API_KEY }}
          FEEDBACK_PRODUCTION_URL: ${{ secrets.FEEDBACK_PRODUCTION_URL }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          MATOMO_URL: ${{ secrets.MATOMO_URL }}
          MATOMO_SITE_ID: ${{ inputs.build_type == 'release' && (secrets.MATOMO_SITE_ID_RELEASE || '2') || (secrets.MATOMO_SITE_ID_DEBUG || '3') }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          ARGS=(
            "--dart-define=COMMIT_HASH=$SHORT_SHA"
            "--dart-define=BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%MZ')"
          )
          for NAME in FEEDBACK_API_KEY FEEDBACK_PRODUCTION_URL TRELLO_BOARD_ID TRELLO_LIST_ID MATOMO_URL MATOMO_SITE_ID; do
            test -n "${!NAME}" || { echo "::error::Required build setting $NAME is missing"; exit 1; }
            ARGS+=("--dart-define=$NAME=${!NAME}")
          done
          # Mask encoded defines too, in case an Xcode error prints build settings.
          python3 - "${ARGS[@]}" <<'PY'
          import base64, sys
          for argument in sys.argv[1:]:
              value = argument.removeprefix('--dart-define=')
              print('::add-mask::' + base64.b64encode(value.encode()).decode())
          PY
          # Verbose Flutter output can expose base64-encoded Dart defines.
          flutter build macos --no-pub --release --flavor production "${ARGS[@]}"
          APP="$WALLET_DIR/build/macos/Build/Products/Release-production/Gleec DEX.app"
          test -d "$APP"
          printf 'APP=%s\n' "$APP" >> "$GITHUB_ENV"
          printf '\nmacOS release compilation completed; service configuration: `%s`.\n' "$BUILD_TYPE" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify app identity, entitlements and nested signatures
        if: contains(fromJSON('["build","notarize","dmg"]'), inputs.stage)
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          python3 <<'PY'
          import os, plistlib, subprocess
          from pathlib import Path
          app = Path(os.environ['APP'])
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          if info['CFBundleIdentifier'] != 'com.GleecDEX.wallet':
              raise SystemExit('Unexpected app bundle identifier')
          executable = app / 'Contents/MacOS' / info['CFBundleExecutable']
          subprocess.run(['lipo', str(executable), '-verify_arch', 'arm64'], check=True)
          entitlements = plistlib.loads(subprocess.check_output(['codesign', '--display', '--entitlements', ':-', str(app)], stderr=subprocess.DEVNULL))
          if entitlements.get('com.apple.security.get-task-allow'):
              raise SystemExit('Distribution app must not allow debugging')
          if not entitlements.get('com.apple.security.app-sandbox'):
              raise SystemExit('Expected the production app sandbox entitlement')
          embedded = app / 'Contents/embedded.provisionprofile'
          profile = plistlib.loads(subprocess.check_output(['security', 'cms', '-D', '-i', str(embedded)]))
          if profile['TeamIdentifier'] != ['B52ZCS7TMQ']:
              raise SystemExit('Unexpected embedded provisioning profile team')
          # Inspect each real Mach-O file, including helpers inside frameworks.
          magics = {b'\xfe\xed\xfa\xce', b'\xce\xfa\xed\xfe', b'\xfe\xed\xfa\xcf', b'\xcf\xfa\xed\xfe', b'\xca\xfe\xba\xbe', b'\xbe\xba\xfe\xca', b'\xca\xfe\xba\xbf', b'\xbf\xba\xfe\xca'}
          binaries = []
          errors = []
          for binary in app.rglob('*'):
              if binary.is_symlink() or not binary.is_file():
                  continue
              with binary.open('rb') as stream:
                  if stream.read(4) not in magics:
                      continue
              binaries.append(binary)
              relative = binary.relative_to(app)
              subprocess.run(['lipo', str(binary), '-verify_arch', 'arm64'], check=True)
              result = subprocess.run(['codesign', '--display', '--verbose=4', str(binary)], capture_output=True, text=True)
              details = result.stderr
              if result.returncode or 'TeamIdentifier=B52ZCS7TMQ' not in details or 'Authority=Developer ID Application:' not in details:
                  errors.append(f'{relative}: missing expected Developer ID signature')
              if 'Timestamp=' not in details:
                  errors.append(f'{relative}: missing secure timestamp')
              header = subprocess.check_output(['otool', '-hv', str(binary)], text=True)
              if 'EXECUTE' in header and 'runtime' not in details:
                  errors.append(f'{relative}: missing hardened runtime')
              print(f'Inspected: {relative}')
          if not binaries:
              raise SystemExit('No Mach-O binaries found')
          if errors:
              raise SystemExit('\n'.join(errors))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'\nVerified app profile/entitlements and {len(binaries)} arm64-compatible Developer ID signed binaries with timestamps.\n')
          PY

      - name: Submit app to Apple notarization
        if: contains(fromJSON('["notarize","dmg"]'), inputs.stage)
        timeout-minutes: 15
        run: |
          ditto -c -k --keepParent "$APP" "$SIGNING_DIR/GleecDEX.zip"
          xcrun notarytool submit "$SIGNING_DIR/GleecDEX.zip" \
            --keychain-profile AC_NOTARY_GLEEC --keychain "$SIGNING_KEYCHAIN" \
            --output-format json > "$SIGNING_DIR/notary-submission.json"
          python3 <<'PY'
          import json, os, uuid
          from pathlib import Path
          data = json.loads((Path(os.environ['SIGNING_DIR']) / 'notary-submission.json').read_text())
          submission_id = str(uuid.UUID(data['id']))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'NOTARY_ID={submission_id}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'\n### Apple notarization\n\nSubmission ID: `{submission_id}`\n')
          print(f'Apple submission ID: {submission_id}')
          PY

      - name: Require Apple Accepted status
        if: contains(fromJSON('["notarize","dmg"]'), inputs.stage)
        timeout-minutes: 25
        run: |
          # A timeout never triggers another upload. Query the same submission ID.
          if ! xcrun notarytool wait "$NOTARY_ID" --timeout 20m \
            --keychain-profile AC_NOTARY_GLEEC --keychain "$SIGNING_KEYCHAIN" \
            --output-format json > "$SIGNING_DIR/notary-result.json"; then
            xcrun notarytool info "$NOTARY_ID" \
              --keychain-profile AC_NOTARY_GLEEC --keychain "$SIGNING_KEYCHAIN" \
              --output-format json > "$SIGNING_DIR/notary-result.json"
          fi
          python3 <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['SIGNING_DIR'])
          result = json.loads((root / 'notary-result.json').read_text())
          status = result.get('status', 'Unknown')
          print(f'Apple notarization status: {status}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'\nApple status: `{status}`\n')
          if status in ('Accepted', 'Invalid', 'Rejected'):
              log_path = root / 'notary-log.json'
              subprocess.run(['xcrun', 'notarytool', 'log', os.environ['NOTARY_ID'],
                              '--keychain-profile', 'AC_NOTARY_GLEEC', '--keychain', os.environ['SIGNING_KEYCHAIN'],
                              str(log_path)], check=True)
              log = json.loads(log_path.read_text())
              for issue in log.get('issues') or []:
                  print(f"{issue.get('severity')}: {issue.get('path')}: {issue.get('message')}")
          if status != 'Accepted':
              raise SystemExit('Notarization was not Accepted. Inspect the recorded submission ID before retrying; no stapling or publication is permitted.')
          PY

      - name: Staple app and verify Gatekeeper assessment
        if: contains(fromJSON('["notarize","dmg"]'), inputs.stage)
        timeout-minutes: 5
        run: |
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute -vv "$APP"
          echo 'Apple Accepted; app ticket stapled and validated; Gatekeeper execute assessment passed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Package the stapled app as DMG
        if: inputs.stage == 'dmg'
        timeout-minutes: 15
        working-directory: ${{ env.WALLET_DIR }}
        env:
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
        run: |
          # Public application files should retain normal read/execute permissions.
          # mktemp still creates the enclosing private directory with mode 0700.
          umask 022
          # System temporary storage supports ownership and hdiutil mountpoints.
          PACKAGING_DIR=$(mktemp -d /private/tmp/gleec-dmg.XXXXXXXX)
          export PACKAGING_DIR
          printf 'PACKAGING_DIR=%s\n' "$PACKAGING_DIR" >> "$GITHUB_ENV"
          python3 <<'PY'
          from pathlib import Path
          script = Path('contrib/make-dmg.sh')
          content = script.read_text()
          old = '  hdiutil detach "/Volumes/${VOL}" -force -quiet || true'
          new = '  echo "ERROR: /Volumes/${VOL} is already in use; close that image before packaging." >&2; exit 1'
          if content.count(old) != 1:
              raise SystemExit('DMG script changed: review its existing-volume handling before running it')
          script.write_text(content.replace(old, new))
          PY
          TMPROOT="$PACKAGING_DIR/work" ./contrib/make-dmg.sh
          DMG_PATH="$WALLET_DIR/dist/gleecdex_macos_$SHORT_SHA.dmg"
          cp ./dist/GleecDEX.dmg "$DMG_PATH"
          printf 'DMG_PATH=%s\n' "$DMG_PATH" >> "$GITHUB_ENV"
          hdiutil verify "$DMG_PATH"

      - name: Verify app and ticket inside the finished DMG
        if: inputs.stage == 'dmg'
        timeout-minutes: 5
        env:
          SOURCE_SHA: ${{ steps.source.outputs.commit_sha }}
          SDK_SHA: ${{ steps.source.outputs.sdk_sha }}
          SAFE_ID: ${{ steps.source.outputs.safe_id }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          MOUNT_POINT="$PACKAGING_DIR/verify"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -noautoopen -mountpoint "$MOUNT_POINT"
          test "$(readlink "$MOUNT_POINT/Applications")" = /Applications
          codesign --verify --deep --strict --verbose=2 "$MOUNT_POINT/Gleec DEX.app"
          xcrun stapler validate "$MOUNT_POINT/Gleec DEX.app"
          spctl --assess --type execute -vv "$MOUNT_POINT/Gleec DEX.app"
          hdiutil detach "$MOUNT_POINT"
          python3 <<'PY'
          import hashlib, json, os
          from pathlib import Path
          dmg = Path(os.environ['DMG_PATH'])
          checksum = hashlib.sha256(dmg.read_bytes()).hexdigest()
          manifest = {'file': dmg.name, 'sha256': checksum,
                      'source_sha': os.environ['SOURCE_SHA'], 'sdk_sha': os.environ['SDK_SHA'],
                      'safe_id': os.environ['SAFE_ID'], 'build_type': os.environ['BUILD_TYPE'],
                      'notary_id': os.environ['NOTARY_ID'], 'notary_status': 'Accepted',
                      'builder_sha': os.environ['GITHUB_SHA']}
          (dmg.parent / 'macos-build.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (dmg.parent / (dmg.name + '.sha256')).write_text(f'{checksum}  {dmg.name}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'\n### Verified DMG\n\nFile: `{dmg.name}`\n\nSHA-256: `{checksum}`\n\n')
              summary.write('Readonly mount, Applications shortcut, nested app signature, stapled ticket and Gatekeeper assessment passed.\n')
          PY

      - name: Upload verified DMG artifact
        if: inputs.stage == 'dmg'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.DMG_PATH }}.sha256
            ${{ env.WALLET_DIR }}/dist/macos-build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Collect notarization report
        if: always() && env.NOTARY_ID != ''
        run: |
          REPORT_DIR="$RUNNER_TEMP/gleec-notary-report-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'REPORT_DIR=%s\n' "$REPORT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$REPORT_DIR"
          for NAME in notary-submission.json notary-result.json notary-log.json; do
            if [ -s "$SIGNING_DIR/$NAME" ]; then
              cp "$SIGNING_DIR/$NAME" "$REPORT_DIR/$NAME"
            fi
          done

      - name: Upload notarization report
        if: always() && env.REPORT_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove DMG mounts and packaging files
        if: always() && contains(fromJSON('["dmg","dmg-check"]'), inputs.stage)
        run: |
          python3 <<'PY'
          import os, plistlib, shutil, subprocess
          from pathlib import Path
          directory = os.environ.get('PACKAGING_DIR')
          if not directory:
              raise SystemExit(0)
          root = Path(directory)
          if root.parent != Path('/private/tmp') or not root.name.startswith('gleec-dmg.'):
              raise SystemExit('Unexpected DMG cleanup directory')
          images = plistlib.loads(subprocess.check_output(['hdiutil', 'info', '-plist']))
          for image in images.get('images', []):
              for entity in image.get('system-entities', []):
                  mount = entity.get('mount-point')
                  if mount and str(mount).startswith(str(root) + '/'):
                      subprocess.run(['hdiutil', 'detach', mount], check=True)
          shutil.rmtree(root)
          print('Run-owned DMG mounts detached and packaging files removed.')
          PY

      - name: Remove local notarization report
        if: always() && env.REPORT_DIR != ''
        run: |
          test "$REPORT_DIR" = "$RUNNER_TEMP/gleec-notary-report-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$REPORT_DIR"

      - name: Remove temporary signing material
        if: always() && contains(fromJSON('["signing","build","notary-auth","notarize","dmg"]'), inputs.stage)
        run: |
          python3 <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          directory = os.environ.get('SIGNING_DIR')
          if not directory:
              raise SystemExit(0)
          root = Path(directory)
          if root.parent != Path(os.environ['RUNNER_TEMP']) or not root.name.startswith('gleec-signing.'):
              raise SystemExit('Unexpected signing cleanup directory')
          errors = []
          saved = root / 'original-keychains.json'
          if saved.exists():
              result = subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *json.loads(saved.read_text())])
              if result.returncode:
                  errors.append('Could not restore keychain search list')
          created = root / 'created-profile.json'
          if created.exists():
              destination = Path(json.loads(created.read_text()))
              expected_parent = Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
              if destination.parent != expected_parent:
                  errors.append('Unexpected provisioning profile cleanup path')
              elif destination.exists():
                  if destination.read_bytes() == (root / 'profile.provisionprofile').read_bytes():
                      destination.unlink()
                  else:
                      errors.append('Provisioning profile changed during the job; preserved for inspection')
          keychain = root / 'build.keychain-db'
          if keychain.exists():
              result = subprocess.run(['security', 'delete-keychain', str(keychain)])
              if result.returncode:
                  errors.append('Could not delete temporary keychain')
          shutil.rmtree(root)
          if errors:
              raise SystemExit('; '.join(errors))
          print('Temporary signing material removed; keychain search list restored.')
          PY

      - name: Remove temporary wallet checkout
        if: always() && (inputs.stage == 'source' || inputs.stage == 'prepare' || contains(fromJSON('["signing","build","notarize","dmg"]'), inputs.stage))
        run: |
          EXPECTED_DIR="$GITHUB_WORKSPACE/wallet-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$WALLET_DIR" = "$EXPECTED_DIR"
          if [ -d "$WALLET_DIR" ]; then
            rm -rf -- "$WALLET_DIR"
          fi

      - name: Remove temporary Flutter SDK
        if: always() && inputs.stage != 'diagnostics' && inputs.stage != 'dmg-check'
        run: |
          if [ -n "${FLUTTER_INSTALL_DIR:-}" ]; then
            case "$FLUTTER_INSTALL_DIR" in
              "$RUNNER_TEMP"/gleec-flutter.*) rm -rf -- "$FLUTTER_INSTALL_DIR" ;;
              *) echo '::error::Unexpected Flutter temporary directory'; exit 1 ;;
            esac
          fi
