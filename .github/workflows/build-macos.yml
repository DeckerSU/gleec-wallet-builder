name: Build Gleec Wallet macOS

run-name: "macOS ${{ inputs.stage }} (by @${{ github.actor }})"

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Last implemented stage to run"
        required: true
        type: choice
        options:
          - diagnostics
          - toolchain
          - source
          - prepare
        default: diagnostics
      ref:
        description: "gleec-wallet ref to build (commit SHA, branch, or tag)"
        required: true
        default: main
      build_type:
        description: "Service configuration and eventual release tag prefix"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: read

concurrency:
  group: gleec-macos-runner
  cancel-in-progress: false

jobs:
  build_macos:
    name: macOS ${{ inputs.stage }}
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'DeckerSU/gleec-wallet-builder' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: ${{ inputs.stage == 'prepare' && 120 || 30 }}
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      COCOAPODS_DISABLE_STATS: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      FLUTTER_VERSION: "3.41.4"
      # Official releases_macos.json: version, arm64 archive checksum and git revision.
      FLUTTER_ARCHIVE_SHA256: "16984a0dae1f13c7b3e05b973913a939144b7e9e3aa6439fa3382599a6326f8c"
      FLUTTER_REVISION: "ff37bef603469fb030f2b72995ab929ccfc227f0"
      WALLET_DIR: ${{ github.workspace }}/wallet-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # No checkout or secrets: inspect the actual service environment first.
      - name: Verify runner platform
        run: |
          {
            echo '## macOS runner diagnostics'
            printf '\nRunner: `%s`\n' "$RUNNER_NAME"
            printf '\nWorkflow commit: `%s`\n' "$GITHUB_SHA"
            printf '\nPlatform: `%s / %s`\n' "$RUNNER_OS" "$RUNNER_ARCH"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64

      - name: Inspect installed tools
        run: |
          # Missing tools are findings, not failures of this inventory stage.
          # Bound each probe so an interactive first launch cannot hang the job.
          probe() {
            local label="$1"
            shift
            printf '\n### %s\n\n```text\n' "$label"
            if command -v "$1" >/dev/null 2>&1; then
              local result=0
              /usr/bin/perl -e 'alarm 60; exec @ARGV or die "exec failed: $!\n"' -- "$@" 2>&1 || result=$?
              printf '\nProbe exit code: %s\n' "$result"
            else
              printf 'MISSING: %s\n' "$1"
            fi
            printf '```\n'
          }

          {
            probe 'macOS version' sw_vers
            probe 'Architecture' uname -m
            probe 'Free space (workspace)' df -h "$GITHUB_WORKSPACE"
            probe 'Free space (temporary directory)' df -h "$RUNNER_TEMP"
            probe 'Selected developer directory' xcode-select -p
            probe 'Xcode version' xcodebuild -version
            probe 'Xcode first-launch status' xcodebuild -checkFirstLaunchStatus
            probe 'macOS SDK version' xcrun --sdk macosx --show-sdk-version
            probe 'macOS SDK path' xcrun --sdk macosx --show-sdk-path
            probe 'notarytool' xcrun notarytool --version
            probe 'stapler location' xcrun --find stapler
            probe 'Git' git --version
            probe 'Homebrew' brew --version
            probe 'Flutter' flutter --version
            probe 'Dart' dart --version
            probe 'Ruby' ruby --version
            probe 'Bundler' bundle --version
            probe 'CocoaPods' pod --version
            probe 'CMake' cmake --version
            probe 'Ninja' ninja --version
            probe 'Rust' rustc --version
            probe 'Python' python3 --version
            printf '\n### Apple utilities\n\n```text\n'
            for tool in codesign security hdiutil ditto osascript file lipo otool; do
              command -v "$tool" || printf 'MISSING: %s\n' "$tool"
            done
            printf '```\n\n### Installed Xcode applications\n\n```text\n'
            for app in /Applications/Xcode*.app; do
              if [ -d "$app" ]; then
                printf '%s\n' "$app"
              fi
            done
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Flutter from the official archive
        if: inputs.stage != 'diagnostics'
        timeout-minutes: 20
        run: |
          FLUTTER_INSTALL_DIR=$(mktemp -d "$RUNNER_TEMP/gleec-flutter.XXXXXXXX")
          printf 'FLUTTER_INSTALL_DIR=%s\n' "$FLUTTER_INSTALL_DIR" >> "$GITHUB_ENV"
          ARCHIVE="$FLUTTER_INSTALL_DIR/flutter.zip"
          ARCHIVE_URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          echo "Downloading Flutter $FLUTTER_VERSION (macOS arm64) from the official release archive."
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 --connect-timeout 30 --max-time 900 \
            "$ARCHIVE_URL" --output "$ARCHIVE"
          printf '%s  %s\n' "$FLUTTER_ARCHIVE_SHA256" "$ARCHIVE" | shasum -a 256 --check -
          ditto -x -k "$ARCHIVE" "$FLUTTER_INSTALL_DIR"
          rm -f "$ARCHIVE"
          FLUTTER_ROOT="$FLUTTER_INSTALL_DIR/flutter"
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = "$FLUTTER_REVISION"
          test -x "$FLUTTER_ROOT/bin/flutter"
          printf 'FLUTTER_ROOT=%s\n' "$FLUTTER_ROOT" >> "$GITHUB_ENV"
          printf '%s\n' "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          {
            echo '### Flutter archive verification'
            printf '\nVersion: `%s` (macOS arm64)\n' "$FLUTTER_VERSION"
            printf '\nSHA-256: `%s` — verified before extraction\n' "$FLUTTER_ARCHIVE_SHA256"
            printf '\nSDK revision: `%s` — verified\n' "$FLUTTER_REVISION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Flutter and download macOS and web artifacts
        if: inputs.stage != 'diagnostics'
        run: |
          flutter --version --machine > "$RUNNER_TEMP/gleec-flutter-version.json"
          python3 - "$RUNNER_TEMP/gleec-flutter-version.json" <<'PY'
          import json
          import os
          import sys
          with open(sys.argv[1]) as source:
              version = json.load(source)
          expected = os.environ['FLUTTER_VERSION']
          if version['frameworkVersion'] != expected:
              raise SystemExit(f"Expected Flutter {expected}, got {version['frameworkVersion']}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"\n### Selected Flutter SDK\n\nFlutter: {expected}\n\n")
              summary.write(f"Dart: {version['dartSdkVersion']}\n")
          PY
          flutter precache --macos --web

      - name: Require full Xcode and working CocoaPods
        if: inputs.stage != 'diagnostics'
        env:
          REQUESTED_XCODE_PATH: ${{ vars.MACOS_XCODE_PATH }}
        run: |
          XCODE_PATH="${REQUESTED_XCODE_PATH:-/Applications/Xcode.app/Contents/Developer}"
          if [ ! -x "$XCODE_PATH/usr/bin/xcodebuild" ]; then
            echo '::error::Full Xcode is required. Install Xcode.app and complete its first launch on the Mac. For a custom location, set MACOS_XCODE_PATH to its Contents/Developer directory.'
            echo '### Toolchain blocked: full Xcode is not installed at the configured path.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          export DEVELOPER_DIR="$XCODE_PATH"
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -checkFirstLaunchStatus
          xcrun --sdk macosx --show-sdk-version
          xcrun notarytool --version
          xcrun --find stapler
          pod --version
          ruby -r cocoapods -e 'abort "Expected CocoaPods 1.16.2" unless Pod::VERSION == "1.16.2"; puts "CocoaPods Ruby libraries load successfully"'
          flutter doctor -v

      - name: Inspect runner session
        run: |
          {
            echo '### Packaging session prerequisites'
            echo
            RUNNER_UID=$(id -u)
            CONSOLE_UID=$(stat -f '%u' /dev/console)
            if [ "$RUNNER_UID" = "$CONSOLE_UID" ]; then
              echo '- Runner user owns the console session: yes'
            else
              echo '- Runner user owns the console session: no'
            fi
            if launchctl print "gui/$RUNNER_UID" >/dev/null 2>&1; then
              echo '- GUI launchd domain for runner user: available'
            else
              echo '- GUI launchd domain for runner user: unavailable'
            fi
            if pgrep -u "$RUNNER_UID" -x Finder >/dev/null 2>&1; then
              echo '- Finder for runner user: running'
            else
              echo '- Finder for runner user: not running'
            fi
            TRANSLATED=$(sysctl -in sysctl.proc_translated 2>/dev/null || true)
            printf -- '- Rosetta translation: %s\n' "${TRANSLATED:-0 (not reported)}"
            echo
            echo 'Finder automation/TCC and disk-image mounting still require a separate packaging test.'
            echo 'No signing identities, provisioning profiles, or notarization credentials were accessed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout wallet source
        if: inputs.stage == 'source' || inputs.stage == 'prepare'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GLEECBTC/gleec-wallet
          ref: ${{ inputs.ref }}
          path: wallet-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and pinned submodules
        if: inputs.stage == 'source' || inputs.stage == 'prepare'
        id: source
        working-directory: ${{ env.WALLET_DIR }}
        env:
          SOURCE_REF: ${{ inputs.ref }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --checkout
          git config fetch.recurseSubmodules on-demand
          git submodule status --recursive > "$RUNNER_TEMP/gleec-submodules.txt"
          cat "$RUNNER_TEMP/gleec-submodules.txt"
          if grep -Eq '^[-+U]' "$RUNNER_TEMP/gleec-submodules.txt"; then
            echo '::error::Submodules do not match the commits pinned in the source tree.'
            exit 1
          fi
          test -z "$(git status --porcelain)"
          COMMIT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          SDK_SHA=$(git -C sdk rev-parse HEAD)
          if git show-ref --verify --quiet "refs/tags/$SOURCE_REF"; then
            SAFE_ID=$(python3 -c 'import os,re; print(re.sub(r"[/\\:*?\"<>|~^\s]", "-", os.environ["SOURCE_REF"]))')
          else
            SAFE_ID="$SHORT_SHA"
          fi
          {
            printf 'commit_sha=%s\n' "$COMMIT_SHA"
            printf 'short_sha=%s\n' "$SHORT_SHA"
            printf 'sdk_sha=%s\n' "$SDK_SHA"
            printf 'safe_id=%s\n' "$SAFE_ID"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Verified source'
            printf '\nWallet commit: `%s`\n' "$COMMIT_SHA"
            printf '\nSDK commit: `%s`\n' "$SDK_SHA"
            printf '\nBuild type: `%s`\n' "$BUILD_TYPE"
            printf '\nRelease identifier: `%s_%s`\n' "$BUILD_TYPE" "$SAFE_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply Firebase production config patch
        if: inputs.stage == 'source' || inputs.stage == 'prepare'
        working-directory: ${{ env.WALLET_DIR }}
        env:
          FIREBASE_PATCH: ${{ secrets.FIREBASE_PATCH }}
        run: |
          test -n "$FIREBASE_PATCH" || { echo '::error::FIREBASE_PATCH is not set'; exit 1; }
          umask 077
          PATCH_FILE=$(mktemp "$RUNNER_TEMP/gleec-firebase.XXXXXXXX")
          trap 'rm -f "$PATCH_FILE"' EXIT
          printf '%s\n' "$FIREBASE_PATCH" > "$PATCH_FILE"
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          test -s macos/Runner/GoogleService-Info.plist
          test -s lib/firebase_options.dart
          echo 'Firebase patch applied successfully (contents omitted).' >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch locked Flutter packages
        if: inputs.stage == 'prepare'
        working-directory: ${{ env.WALLET_DIR }}
        run: |
          flutter clean
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Generate macOS Pods project
        if: inputs.stage == 'prepare'
        working-directory: ${{ env.WALLET_DIR }}/macos
        run: |
          pod deintegrate
          # Refresh spec metadata while retaining locked dependency versions.
          pod install --repo-update
          git show HEAD:macos/Podfile.lock > "$RUNNER_TEMP/gleec-Podfile.lock"
          ruby -r cocoapods <<'RUBY'
          original = Pod::Lockfile.from_file(Pathname.new(ENV.fetch('RUNNER_TEMP')).join('gleec-Podfile.lock')).to_hash
          current = Pod::Lockfile.from_file(Pathname.new('Podfile.lock')).to_hash
          original_checksums = original.fetch('SPEC CHECKSUMS')
          current_checksums = current.fetch('SPEC CHECKSUMS')
          changed = (original_checksums.keys | current_checksums.keys).select do |name|
            original_checksums[name] != current_checksums[name]
          end
          local_sources = original.fetch('EXTERNAL SOURCES', {})
          changed.each do |name|
            source = local_sources.fetch(name, {})
            path = source[':path']
            unless original_checksums.key?(name) && current_checksums.key?(name) &&
                   path && path.start_with?('Flutter/ephemeral/.symlinks/plugins/')
              abort "Unexpected checksum change for nonlocal pod: #{name}"
            end
            # Dart packages are already verified by pub get --enforce-lockfile.
            original_checksums[name] = current_checksums[name]
          end
          abort 'Pod dependency versions or sources changed' unless original == current
          unless changed.empty?
            message = "Local Flutter podspec checksums refreshed (versions unchanged): #{changed.sort.join(', ')}"
            puts message
            File.open(ENV.fetch('GITHUB_STEP_SUMMARY'), 'a') { |f| f.puts "\n#{message}\n" }
          end
          RUBY

      - name: Generate assets with the web build
        if: inputs.stage == 'prepare'
        working-directory: ${{ env.WALLET_DIR }}
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GH_API_PUBLIC_READONLY_TOKEN || github.token }}
        run: flutter build web --no-pub

      - name: Verify macOS KDF and generated assets
        if: inputs.stage == 'prepare'
        working-directory: ${{ env.WALLET_DIR }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import unquote, urljoin, urlparse

          package_config = Path('.dart_tool/package_config.json').resolve()
          packages = json.loads(package_config.read_text())['packages']
          package = next(p for p in packages if p['name'] == 'komodo_defi_framework')
          uri = urlparse(urljoin(package_config.as_uri(), package['rootUri']))
          if uri.scheme != 'file':
              raise SystemExit('Expected a local komodo_defi_framework package')
          root = Path(unquote(uri.path))
          config = json.loads((root / 'app_build/build_config.json').read_text())
          for relative in config['coins']['mapped_files']:
              path = root / relative
              if not json.loads(path.read_text()):
                  raise SystemExit(f'Empty generated config: {relative}')
          for relative in config['coins']['mapped_folders']:
              if not any(p.is_file() and p.stat().st_size for p in (root / relative).rglob('*.png')):
                  raise SystemExit(f'Missing generated coin icons: {relative}')
          kdf = root / config['api']['platforms']['macos']['path'] / 'kdf'
          if not kdf.is_file() or not kdf.stat().st_size:
              raise SystemExit('Missing macOS KDF executable')
          subprocess.run(['lipo', '-verify_arch', 'arm64', str(kdf)], check=True)
          architectures = subprocess.check_output(['lipo', '-archs', str(kdf)], text=True).strip()
          subprocess.run(['otool', '-L', str(kdf)], check=True)
          checksum = hashlib.sha256(kdf.read_bytes()).hexdigest()
          dylib = root / 'macos/lib/libkdflib.dylib'
          if dylib.exists():
              subprocess.run(['lipo', '-verify_arch', 'arm64', str(dylib)], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n### Prepared macOS assets\n\n')
              summary.write(f"KDF commit: `{config['api']['api_commit_hash']}`\n\n")
              summary.write(f'KDF architectures: `{architectures}`\n\n')
              summary.write(f'KDF executable SHA-256: `{checksum}`\n\n')
              summary.write(f"Coins commit after generation: `{config['coins']['bundled_coins_repo_commit']}`\n\n")
              summary.write('Required coin configs and icons are present; macOS KDF supports arm64.\n')
          print('macOS KDF architecture and generated coin assets verified.')
          PY

      - name: Remove temporary wallet checkout
        if: always() && (inputs.stage == 'source' || inputs.stage == 'prepare')
        run: |
          EXPECTED_DIR="$GITHUB_WORKSPACE/wallet-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$WALLET_DIR" = "$EXPECTED_DIR"
          if [ -d "$WALLET_DIR" ]; then
            rm -rf -- "$WALLET_DIR"
          fi

      - name: Remove temporary Flutter SDK
        if: always() && inputs.stage != 'diagnostics'
        run: |
          if [ -n "${FLUTTER_INSTALL_DIR:-}" ]; then
            case "$FLUTTER_INSTALL_DIR" in
              "$RUNNER_TEMP"/gleec-flutter.*) rm -rf -- "$FLUTTER_INSTALL_DIR" ;;
              *) echo '::error::Unexpected Flutter temporary directory'; exit 1 ;;
            esac
          fi
