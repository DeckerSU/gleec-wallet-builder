name: Build Gleec Wallet Android
run-name: Android ${{ inputs.stage }} / ${{ inputs.artifact_type }} (by @${{ github.actor }})
'on':
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to run
        required: true
        type: choice
        options:
        - diagnostics
        - toolchain
        - source
        - prepare
        - signing
        - build
        - publish
        default: diagnostics
      ref:
        description: gleec-wallet branch, tag or commit SHA
        required: true
        default: main
      build_type:
        description: Service configuration and release tag prefix
        required: true
        type: choice
        options:
        - debug
        - release
        default: debug
      artifact_type:
        description: Android output format
        required: true
        type: choice
        options:
        - appbundle
        - apk
        default: appbundle
      build_number:
        description: Android versionCode (increase for each Google Play upload)
        required: true
        type: string
        default: '16'
permissions:
  contents: read
concurrency:
  group: gleec-macos-runner
  cancel-in-progress: false
jobs:
  build_android:
    name: Android ${{ inputs.stage }}
    if: github.event_name == 'workflow_dispatch' && github.repository == 'DeckerSU/gleec-wallet-builder' && github.actor ==
      github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on:
    - self-hosted
    - macOS
    - ARM64
    timeout-minutes: 150
    environment: android-signing
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      FLUTTER_VERSION: 3.41.4
      FLUTTER_ARCHIVE_SHA256: 16984a0dae1f13c7b3e05b973913a939144b7e9e3aa6439fa3382599a6326f8c
      FLUTTER_REVISION: ff37bef603469fb030f2b72995ab929ccfc227f0
      WALLET_DIR: ${{ github.workspace }}/wallet-android-${{ github.run_id }}-${{ github.run_attempt }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      ARTIFACT_TYPE: ${{ inputs.artifact_type }}
    steps:
    - name: Verify inputs and inspect Android runner
      run: |
        test "$RUNNER_OS" = macOS
        test "$RUNNER_ARCH" = ARM64
        test "$(uname -m)" = arm64
        python3 <<'PY'
        import os, re
        value = os.environ['BUILD_NUMBER']
        if not re.fullmatch(r'[1-9][0-9]{0,9}', value) or int(value) > 2100000000:
            raise SystemExit('build_number must be an integer from 1 to 2100000000')
        if os.environ['ARTIFACT_TYPE'] not in ('appbundle', 'apk'):
            raise SystemExit('Choose appbundle or apk')
        PY
        {
          echo '## Android runner diagnostics'
          printf '\nRunner: `%s`\n\nBuilder: `%s`\n' "$RUNNER_NAME" "$GITHUB_SHA"
          sw_vers
          df -h "$GITHUB_WORKSPACE"
          /usr/libexec/java_home -V 2>&1 || true
          printf '\nExisting Android SDK directories:\n'
          for directory in "$HOME/Library/Android/sdk" "$HOME/Library/Caches/gleec-wallet-builder/android-sdk"; do
            if [ -d "$directory" ]; then ls -ld "$directory"; fi
          done
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo 'Rosetta x86_64 execution: available'
          else
            echo 'Rosetta x86_64 execution: unavailable (some Android build tools may require it)'
          fi
        } | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Create isolated Android build directories
      if: inputs.stage != 'diagnostics'
      run: |
        umask 077
        ANDROID_RUN_DIR=$(mktemp -d "$RUNNER_TEMP/gleec-android.XXXXXXXX")
        mkdir "$ANDROID_RUN_DIR/gradle"
        printf 'org.gradle.daemon=false\nkotlin.compiler.execution.strategy=in-process\n' > "$ANDROID_RUN_DIR/gradle/gradle.properties"
        {
          printf 'ANDROID_RUN_DIR=%s\n' "$ANDROID_RUN_DIR"
          printf 'GRADLE_USER_HOME=%s/gradle\n' "$ANDROID_RUN_DIR"
          printf 'ANDROID_USER_HOME=%s/android-user\n' "$ANDROID_RUN_DIR"
          printf 'ANDROID_HOME=%s/Library/Caches/gleec-wallet-builder/android-sdk\n' "$HOME"
          printf 'ANDROID_SDK_ROOT=%s/Library/Caches/gleec-wallet-builder/android-sdk\n' "$HOME"
        } >> "$GITHUB_ENV"
    - name: Install pinned Temurin JDK 17 for Apple Silicon
      if: inputs.stage != 'diagnostics'
      timeout-minutes: 15
      env:
        JDK_URL: https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_aarch64_mac_hotspot_17.0.20.1_1.tar.gz
        JDK_SHA256: 196d13ba5f10414bef7f6a05a9b3f00edacb18ebacef2b99485db9e2ee18f0e8
      run: |
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
          --connect-timeout 30 --max-time 900 "$JDK_URL" -o "$ANDROID_RUN_DIR/jdk.tar.gz"
        printf '%s  %s\n' "$JDK_SHA256" "$ANDROID_RUN_DIR/jdk.tar.gz" | shasum -a 256 --check -
        mkdir "$ANDROID_RUN_DIR/jdk"
        tar -xzf "$ANDROID_RUN_DIR/jdk.tar.gz" -C "$ANDROID_RUN_DIR/jdk" --strip-components=1
        rm "$ANDROID_RUN_DIR/jdk.tar.gz"
        JAVA_HOME="$ANDROID_RUN_DIR/jdk/Contents/Home"
        test -x "$JAVA_HOME/bin/javac"
        printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
        printf '%s/bin\n' "$JAVA_HOME" >> "$GITHUB_PATH"
        "$JAVA_HOME/bin/java" -version
    - name: Install Android command-line tools and SDK packages
      if: inputs.stage != 'diagnostics'
      timeout-minutes: 35
      run: |
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        if [ ! -x "$ANDROID_HOME/cmdline-tools/19.0/bin/sdkmanager" ]; then
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --connect-timeout 30 --max-time 900 \
            https://dl.google.com/android/repository/commandlinetools-mac-13114758_latest.zip \
            -o "$ANDROID_RUN_DIR/commandlinetools.zip"
          printf '%s  %s\n' '5673201e6f3869f418eeed3b5cb6c4be7401502bd0aae1b12a29d164d647a54e' \
            "$ANDROID_RUN_DIR/commandlinetools.zip" | shasum -a 256 --check -
          ditto -x -k "$ANDROID_RUN_DIR/commandlinetools.zip" "$ANDROID_RUN_DIR/cmdline"
          mv "$ANDROID_RUN_DIR/cmdline/cmdline-tools" "$ANDROID_HOME/cmdline-tools/19.0"
          rm "$ANDROID_RUN_DIR/commandlinetools.zip"
        fi
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/19.0/bin/sdkmanager"
        "$SDKMANAGER" --version
        # Repository owner authorized accepting Android SDK licenses on 2026-09-27.
        # Ignore only yes's SIGPIPE, never sdkmanager's exit status.
        set +e
        yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
        RESULTS=("${PIPESTATUS[@]}")
        set -e
        test "${RESULTS[1]}" -eq 0
        "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
          'platform-tools' 'platforms;android-35' 'platforms;android-36' \
          'build-tools;35.0.0' 'build-tools;36.0.0' \
          'ndk;27.0.12077973' 'ndk;28.2.13676358' 'cmake;3.22.1'
        {
          printf '%s/cmdline-tools/19.0/bin\n' "$ANDROID_HOME"
          printf '%s/platform-tools\n' "$ANDROID_HOME"
          printf '%s/build-tools/35.0.0\n' "$ANDROID_HOME"
        } >> "$GITHUB_PATH"
        "$ANDROID_HOME/build-tools/35.0.0/aapt2" version
        "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version
        "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/darwin-x86_64/bin/clang" --version
        "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list_installed >> "$GITHUB_STEP_SUMMARY"
    - name: Install Flutter from the official archive
      if: inputs.stage != 'diagnostics'
      timeout-minutes: 20
      run: |
        FLUTTER_INSTALL_DIR=$(mktemp -d "$RUNNER_TEMP/gleec-flutter.XXXXXXXX")
        printf 'FLUTTER_INSTALL_DIR=%s\n' "$FLUTTER_INSTALL_DIR" >> "$GITHUB_ENV"
        ARCHIVE="$FLUTTER_INSTALL_DIR/flutter.zip"
        ARCHIVE_URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
        echo "Downloading Flutter $FLUTTER_VERSION (macOS arm64) from the official release archive."
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          --retry 3 --connect-timeout 30 --max-time 900 \
          "$ARCHIVE_URL" --output "$ARCHIVE"
        printf '%s  %s\n' "$FLUTTER_ARCHIVE_SHA256" "$ARCHIVE" | shasum -a 256 --check -
        ditto -x -k "$ARCHIVE" "$FLUTTER_INSTALL_DIR"
        rm -f "$ARCHIVE"
        FLUTTER_ROOT="$FLUTTER_INSTALL_DIR/flutter"
        test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = "$FLUTTER_REVISION"
        test -x "$FLUTTER_ROOT/bin/flutter"
        printf 'FLUTTER_ROOT=%s\n' "$FLUTTER_ROOT" >> "$GITHUB_ENV"
        printf '%s\n' "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
        {
          echo '### Flutter archive verification'
          printf '\nVersion: `%s` (macOS arm64)\n' "$FLUTTER_VERSION"
          printf '\nSHA-256: `%s` — verified before extraction\n' "$FLUTTER_ARCHIVE_SHA256"
          printf '\nSDK revision: `%s` — verified\n' "$FLUTTER_REVISION"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Verify Flutter and download Android and web artifacts
      if: inputs.stage != 'diagnostics'
      run: |
        flutter --version --machine > "$RUNNER_TEMP/gleec-flutter-version.json"
        python3 - "$RUNNER_TEMP/gleec-flutter-version.json" <<'PY'
        import json
        import os
        import sys
        with open(sys.argv[1]) as source:
            version = json.load(source)
        expected = os.environ['FLUTTER_VERSION']
        if version['frameworkVersion'] != expected:
            raise SystemExit(f"Expected Flutter {expected}, got {version['frameworkVersion']}")
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write(f"\n### Selected Flutter SDK\n\nFlutter: {expected}\n\n")
            summary.write(f"Dart: {version['dartSdkVersion']}\n")
        PY
        flutter precache --android --web
        flutter doctor -v
    - name: Checkout wallet source
      if: contains(fromJSON('["source","prepare","signing","build","publish"]'), inputs.stage)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: GLEECBTC/gleec-wallet
        ref: ${{ inputs.ref }}
        path: wallet-android-${{ github.run_id }}-${{ github.run_attempt }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify source and pinned submodules
      if: contains(fromJSON('["source","prepare","signing","build","publish"]'), inputs.stage)
      id: source
      working-directory: ${{ env.WALLET_DIR }}
      env:
        SOURCE_REF: ${{ inputs.ref }}
        BUILD_TYPE: ${{ inputs.build_type }}
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive --checkout
        git config fetch.recurseSubmodules on-demand
        git submodule status --recursive > "$ANDROID_RUN_DIR/submodules.txt"
        cat "$ANDROID_RUN_DIR/submodules.txt"
        if grep -Eq '^[-+U]' "$ANDROID_RUN_DIR/submodules.txt"; then
          echo '::error::Submodules do not match the commits pinned in the source tree.'
          exit 1
        fi
        test -z "$(git status --porcelain)"
        COMMIT_SHA=$(git rev-parse HEAD)
        SHORT_SHA=$(git rev-parse --short=7 HEAD)
        SDK_SHA=$(git -C sdk rev-parse HEAD)
        if git show-ref --verify --quiet "refs/tags/$SOURCE_REF"; then
          SAFE_ID=$(python3 -c 'import os,re; print(re.sub(r"[/\\:*?\"<>|~^\s]", "-", os.environ["SOURCE_REF"]))')
        else
          SAFE_ID="$SHORT_SHA"
        fi
        {
          printf 'commit_sha=%s\n' "$COMMIT_SHA"
          printf 'short_sha=%s\n' "$SHORT_SHA"
          printf 'sdk_sha=%s\n' "$SDK_SHA"
          printf 'safe_id=%s\n' "$SAFE_ID"
        } >> "$GITHUB_OUTPUT"
        {
          echo '### Verified source'
          printf '\nWallet commit: `%s`\n' "$COMMIT_SHA"
          printf '\nSDK commit: `%s`\n' "$SDK_SHA"
          printf '\nBuild type: `%s`\n' "$BUILD_TYPE"
          printf '\nRelease identifier: `%s_%s`\n' "$BUILD_TYPE" "$SAFE_ID"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Apply Firebase production config patch
      if: contains(fromJSON('["source","prepare","signing","build","publish"]'), inputs.stage)
      working-directory: ${{ env.WALLET_DIR }}
      env:
        FIREBASE_PATCH: ${{ secrets.FIREBASE_PATCH }}
      run: |
        test -n "$FIREBASE_PATCH" || { echo '::error::FIREBASE_PATCH is not set'; exit 1; }
        umask 077
        PATCH_FILE=$(mktemp "$RUNNER_TEMP/gleec-firebase.XXXXXXXX")
        trap 'rm -f "$PATCH_FILE"' EXIT
        printf '%s\n' "$FIREBASE_PATCH" > "$PATCH_FILE"
        git apply --check "$PATCH_FILE"
        git apply "$PATCH_FILE"
        test -s android/app/google-services.json
        test -s lib/firebase_options.dart
        echo 'Firebase patch applied successfully (contents omitted).' >> "$GITHUB_STEP_SUMMARY"
    - name: Check Android project configuration
      if: contains(fromJSON('["source","prepare","signing","build","publish"]'), inputs.stage)
      working-directory: ${{ env.WALLET_DIR }}
      run: |
        python3 <<'PY'
        import json, os, re
        from pathlib import Path
        app = Path('android/app/build.gradle').read_text()
        settings = Path('android/settings.gradle').read_text()
        expected = [r'compileSdk\s+36\b', r'targetSdkVersion\s+36\b', r'minSdkVersion\s+28\b',
                    r'ndkVersion\s*=\s*"28\.2\.13676358"', r'applicationId\s+"com\.gleec\.gleecdex"']
        if not all(re.search(pattern, app) for pattern in expected):
            raise SystemExit('Android SDK/application settings changed; review toolchain pins for this ref')
        if not re.search(r'id "com.android.application" version "8\.11\.1"', settings):
            raise SystemExit('Android Gradle plugin changed; review toolchain compatibility')
        firebase = json.loads(Path('android/app/google-services.json').read_text())
        packages = {client['client_info']['android_client_info']['package_name'] for client in firebase['client']}
        if 'com.gleec.gleecdex' not in packages:
            raise SystemExit('Firebase config has no matching Android application ID')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('\nAndroid: com.gleec.gleecdex; min SDK 28; compile/target SDK 36; AGP 8.11.1; NDK 28.2.13676358.\n')
        PY
    - name: Fetch locked Flutter packages
      if: contains(fromJSON('["prepare","signing","build","publish"]'), inputs.stage)
      working-directory: ${{ env.WALLET_DIR }}
      run: |
        flutter clean
        flutter pub get --enforce-lockfile
        git diff --exit-code -- pubspec.lock
    - name: Generate assets with the web build
      if: contains(fromJSON('["prepare","signing","build","publish"]'), inputs.stage)
      working-directory: ${{ env.WALLET_DIR }}
      env:
        GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GH_API_PUBLIC_READONLY_TOKEN || github.token }}
      run: |
        WEB_LOG=$(mktemp "$RUNNER_TEMP/gleec-web.XXXXXXXX")
        trap 'rm -f "$WEB_LOG"' EXIT
        set +e
        flutter build web --no-pub 2>&1 | tee "$WEB_LOG"
        RESULTS=("${PIPESTATUS[@]}")
        set -e
        test "${RESULTS[1]}" -eq 0
        if [ "${RESULTS[0]}" -ne 0 ]; then
          if grep -Fq 'What: Coin assets were updated.' "$WEB_LOG" &&
             grep -Fq 'Transformer package: komodo_wallet_build_transformer' "$WEB_LOG"; then
            echo 'Transformer updated coin assets; running the required second web build.'
            echo 'Web asset generation required one retry after the transformer updated coin assets.' >> "$GITHUB_STEP_SUMMARY"
            flutter build web --no-pub
          else
            exit "${RESULTS[0]}"
          fi
        fi
    - name: Verify Android KDF assets and Gradle wrapper
      if: contains(fromJSON('["prepare","signing","build","publish"]'), inputs.stage)
      working-directory: ${{ env.WALLET_DIR }}
      run: |
        python3 <<'PY'
        import hashlib, json, os, subprocess
        from pathlib import Path
        root = Path('sdk/packages/komodo_defi_framework')
        config = json.loads((root / 'app_build/build_config.json').read_text())
        for relative in config['coins']['mapped_files']:
            if not json.loads((root / relative).read_text()):
                raise SystemExit(f'Empty generated coin config: {relative}')
        for relative in config['coins']['mapped_folders']:
            if not any(p.stat().st_size for p in (root / relative).rglob('*.png')):
                raise SystemExit('Missing generated coin icons')
        for platform in ('android-armv7', 'android-aarch64'):
            spec = config['api']['platforms'][platform]
            directory = root / spec['path']
            library = directory / 'libkdf.a'
            if not library.is_file() or library.stat().st_size == 0:
                raise SystemExit(f'Missing KDF static library for {platform}')
            marker = json.loads((directory / f'.api_last_updated_{platform}').read_text())
            if marker['api_commit_hash'] != config['api']['api_commit_hash']:
                raise SystemExit(f'KDF source mismatch for {platform}')
            if marker['checksums'] != spec['valid_zip_sha256_checksums']:
                raise SystemExit(f'KDF archive provenance mismatch for {platform}')
            if marker['artifact_sha256'] != hashlib.sha256(library.read_bytes()).hexdigest():
                raise SystemExit(f'KDF static library checksum mismatch for {platform}')
            print(f'Verified KDF static library: {platform}')
        PY
        cd android
        ./gradlew --no-daemon --version
    - name: Install and validate the Android signing key
      if: contains(fromJSON('["signing","build","publish"]'), inputs.stage)
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        umask 077
        python3 <<'PY'
        import base64, os
        from pathlib import Path
        for key in ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD', 'ANDROID_KEYSTORE_TYPE'):
            if not os.environ.get(key):
                raise SystemExit(f'Missing Android signing secret: {key}')
        root = Path(os.environ['ANDROID_RUN_DIR'])
        store = root / 'release.keystore'
        store.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
        with open(os.environ['GITHUB_ENV'], 'a') as env:
            env.write(f'ANDROID_KEYSTORE_PATH={store}\n')
        PY
        export ANDROID_KEYSTORE_PATH="$ANDROID_RUN_DIR/release.keystore"
        cat > "$ANDROID_RUN_DIR/SigningProbe.java" <<'JAVA'
        import java.io.*;
        import java.nio.file.*;
        import java.security.*;
        import java.security.cert.X509Certificate;
        import java.util.HexFormat;
        class SigningProbe {
            public static void main(String[] args) throws Exception {
                KeyStore store = KeyStore.getInstance(System.getenv("ANDROID_KEYSTORE_TYPE"));
                try (var input = Files.newInputStream(Path.of(System.getenv("ANDROID_KEYSTORE_PATH")))) {
                    store.load(input, System.getenv("ANDROID_KEYSTORE_PASSWORD").toCharArray());
                }
                String alias = System.getenv("ANDROID_KEY_ALIAS");
                Key key = store.getKey(alias, System.getenv("ANDROID_KEY_PASSWORD").toCharArray());
                if (!(key instanceof PrivateKey)) throw new IllegalStateException("Alias is not a private key");
                var cert = (X509Certificate) store.getCertificate(alias);
                cert.checkValidity();
                if (cert.getSubjectX500Principal().getName().contains("CN=Android Debug"))
                    throw new IllegalStateException("Android debug signing key is not allowed");
                String algorithm = switch (key.getAlgorithm()) {
                    case "RSA" -> "SHA256withRSA";
                    case "EC" -> "SHA256withECDSA";
                    case "DSA" -> "SHA256withDSA";
                    default -> throw new IllegalStateException("Unsupported signing key algorithm");
                };
                var signature = Signature.getInstance(algorithm);
                byte[] payload = "Gleec Android signing preflight".getBytes(java.nio.charset.StandardCharsets.UTF_8);
                signature.initSign((PrivateKey) key);
                signature.update(payload);
                byte[] signed = signature.sign();
                signature.initVerify(cert);
                signature.update(payload);
                if (!signature.verify(signed)) throw new IllegalStateException("Signing probe failed");
                String fingerprint = HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(cert.getEncoded()));
                Files.writeString(Path.of(System.getenv("GITHUB_ENV")), "ANDROID_CERT_SHA256=" + fingerprint + "\n", StandardOpenOption.APPEND);
                Files.writeString(Path.of(System.getenv("GITHUB_STEP_SUMMARY")), "\nAndroid private key and both passwords verified. Certificate SHA-256: `" + fingerprint + "`.\n", StandardOpenOption.APPEND);
            }
        }
        JAVA
        java "$ANDROID_RUN_DIR/SigningProbe.java"
    - name: Patch Android release signing in the isolated source
      if: contains(fromJSON('["signing","build","publish"]'), inputs.stage)
      working-directory: ${{ env.WALLET_DIR }}
      run: |
        python3 <<'PY'
        from pathlib import Path
        path = Path('android/app/build.gradle')
        content = path.read_text()
        old = 'signingConfig signingConfigs.debug'
        new = 'signingConfig signingConfigs.ciRelease'
        config = '''
            // CI signing: values are supplied only by the Android signing environment.
            signingConfigs {
                ciRelease {
                    storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                    storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                    keyAlias System.getenv("ANDROID_KEY_ALIAS")
                    keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                    storeType System.getenv("ANDROID_KEYSTORE_TYPE")
                }
            }
        '''
        if config in content and content.count(new) == 1 and old not in content:
            print('CI release signing patch is already present')
        elif content.count(old) == 1 and content.count('android {') == 1 and 'signingConfigs {' not in content and new not in content:
            content = content.replace('android {', 'android {' + config, 1).replace(old, new, 1)
            content = content.replace('            // TODO: Add your own signing config for the release build.\n', '')
            content = content.replace('            // Signing with the debug keys for now, so `flutter run --release` works.\n', '')
            path.write_text(content)
            print('Android release now uses ciRelease signing from environment variables')
        else:
            raise SystemExit('Unrecognized Android signing configuration; review the source before applying the CI patch')
        PY
    - name: Validate Gradle release signing configuration
      if: contains(fromJSON('["signing","build","publish"]'), inputs.stage)
      working-directory: ${{ env.WALLET_DIR }}/android
      timeout-minutes: 25
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
      run: |
        ./gradlew --no-daemon :app:validateSigningRelease
    - name: Build signed Android package
      if: contains(fromJSON('["build","publish"]'), inputs.stage)
      timeout-minutes: 60
      working-directory: ${{ env.WALLET_DIR }}
      env:
        GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GH_API_PUBLIC_READONLY_TOKEN || github.token }}
        FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_API_KEY }}
        FEEDBACK_PRODUCTION_URL: ${{ secrets.FEEDBACK_PRODUCTION_URL }}
        TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
        TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
        MATOMO_URL: ${{ secrets.MATOMO_URL }}
        MATOMO_SITE_ID: ${{ inputs.build_type == 'release' && (secrets.MATOMO_SITE_ID_RELEASE || '2') || (secrets.MATOMO_SITE_ID_DEBUG
          || '3') }}
        BUILD_TYPE: ${{ inputs.build_type }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
      run: |
        SHORT_SHA=$(git rev-parse --short=7 HEAD)
        ARGS=(
          "--dart-define=COMMIT_HASH=$SHORT_SHA"
          "--dart-define=BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%MZ')"
        )
        for NAME in FEEDBACK_API_KEY FEEDBACK_PRODUCTION_URL TRELLO_BOARD_ID TRELLO_LIST_ID MATOMO_URL MATOMO_SITE_ID; do
          test -n "${!NAME}" || { echo "::error::Required build setting $NAME is missing"; exit 1; }
          ARGS+=("--dart-define=$NAME=${!NAME}")
        done
        # Mask encoded defines too, in case a Gradle error prints build settings.
        python3 - "${ARGS[@]}" <<'PY'
        import base64, sys
        for argument in sys.argv[1:]:
            value = argument.removeprefix('--dart-define=')
            print('::add-mask::' + base64.b64encode(value.encode()).decode())
        PY
        # Avoid verbose Flutter/Gradle output that can expose encoded Dart defines.
        flutter build "$ARTIFACT_TYPE" --release --build-number="$BUILD_NUMBER" --no-pub \
          --target-platform android-arm,android-arm64 "${ARGS[@]}"
    - name: Install pinned bundletool for AAB validation
      if: contains(fromJSON('["build","publish"]'), inputs.stage) && inputs.artifact_type == 'appbundle'
      run: |
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
          --connect-timeout 30 --max-time 300 \
          https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
          -o "$ANDROID_RUN_DIR/bundletool.jar"
        printf '%s  %s\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' \
          "$ANDROID_RUN_DIR/bundletool.jar" | shasum -a 256 --check -
    - name: Verify Android signature, manifest and native libraries
      if: contains(fromJSON('["build","publish"]'), inputs.stage)
      env:
        SOURCE_REF: ${{ inputs.ref }}
        BUILD_TYPE: ${{ inputs.build_type }}
      run: |
        if [ "$ARTIFACT_TYPE" = appbundle ]; then
          PACKAGE="$WALLET_DIR/build/app/outputs/bundle/release/app-release.aab"
          java -jar "$ANDROID_RUN_DIR/bundletool.jar" validate --bundle="$PACKAGE"
          java -jar "$ANDROID_RUN_DIR/bundletool.jar" dump manifest --bundle="$PACKAGE" > "$ANDROID_RUN_DIR/manifest.xml"
          # Verify every payload entry and its signer; jarsigner alone can return success for unsigned JARs.
          cat > "$ANDROID_RUN_DIR/VerifyBundle.java" <<'JAVA'
        import java.util.*;
        import java.util.jar.*;
        import java.security.*;
        class VerifyBundle {
            public static void main(String[] args) throws Exception {
                try (var jar = new JarFile(args[0], true)) {
                    int count = 0;
                    var entries = jar.entries();
                    while (entries.hasMoreElements()) {
                        var entry = entries.nextElement();
                        String name = entry.getName().toUpperCase(Locale.ROOT);
                        if (entry.isDirectory() || name.equals("META-INF/MANIFEST.MF") || name.matches("META-INF/[^/]+\\.(SF|RSA|DSA|EC)")) continue;
                        try (var input = jar.getInputStream(entry)) { input.transferTo(java.io.OutputStream.nullOutputStream()); }
                        var signers = entry.getCodeSigners();
                        if (signers == null || signers.length != 1) throw new SecurityException("Unsigned or ambiguously signed bundle entry");
                        var cert = signers[0].getSignerCertPath().getCertificates().get(0);
                        String actual = HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(cert.getEncoded()));
                        if (!actual.equals(System.getenv("ANDROID_CERT_SHA256"))) throw new SecurityException("Unexpected bundle signer");
                        count++;
                    }
                    if (count == 0) throw new SecurityException("Empty signed bundle");
                    System.out.println("Verified bundle signatures for " + count + " entries");
                }
            }
        }
        JAVA
          java "$ANDROID_RUN_DIR/VerifyBundle.java" "$PACKAGE"
        else
          PACKAGE="$WALLET_DIR/build/app/outputs/flutter-apk/app-release.apk"
          apksigner verify --verbose --print-certs "$PACKAGE" > "$ANDROID_RUN_DIR/apk-signature.txt"
          apkanalyzer manifest print "$PACKAGE" > "$ANDROID_RUN_DIR/manifest.xml"
          zipalign -c -P 16 -v 4 "$PACKAGE" > "$ANDROID_RUN_DIR/zipalign.txt"
        fi
        export PACKAGE
        python3 <<'PY'
        import hashlib, json, os, re, shutil, struct, subprocess, zipfile
        import xml.etree.ElementTree as ET
        from pathlib import Path
        root = Path(os.environ['ANDROID_RUN_DIR'])
        kind = os.environ['ARTIFACT_TYPE']
        if kind == 'apk':
            report = (root / 'apk-signature.txt').read_text()
            signers = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)$', report, re.M)
            if [value.lower() for value in signers] != [os.environ['ANDROID_CERT_SHA256']]:
                raise SystemExit('APK signer does not match the supplied keystore')
        manifest = ET.parse(root / 'manifest.xml').getroot()
        ns = '{http://schemas.android.com/apk/res/android}'
        if manifest.get('package') != 'com.gleec.gleecdex':
            raise SystemExit('Unexpected Android application ID')
        if manifest.get(ns + 'versionCode') != os.environ['BUILD_NUMBER']:
            raise SystemExit('Android versionCode does not match build_number')
        if manifest.find('application').get(ns + 'debuggable', 'false') != 'false':
            raise SystemExit('Android release package must not be debuggable')
        package = Path(os.environ['PACKAGE'])
        prefix = 'base/lib/' if kind == 'appbundle' else 'lib/'
        with zipfile.ZipFile(package) as archive:
            abis = {name[len(prefix):].split('/')[0] for name in archive.namelist() if name.startswith(prefix) and name.endswith('.so')}
            if abis != {'armeabi-v7a', 'arm64-v8a'}:
                raise SystemExit(f'Unexpected packaged ABIs: {abis}')
            for abi, machine, elf_class in [('armeabi-v7a', 40, 1), ('arm64-v8a', 183, 2)]:
                for name in ('libflutter.so', 'libapp.so', 'libkomodo_defi_framework.so'):
                    with archive.open(prefix + abi + '/' + name) as library:
                        header = library.read(20)
                    if header[:4] != b'\x7fELF' or header[4] != elf_class or header[5] != 1 or struct.unpack('<H', header[18:20])[0] != machine:
                        raise SystemExit(f'Wrong ELF architecture for {abi}/{name}')
        wallet = Path(os.environ['WALLET_DIR'])
        sha = subprocess.check_output(['git', '-C', str(wallet), 'rev-parse', 'HEAD'], text=True).strip()
        short = subprocess.check_output(['git', '-C', str(wallet), 'rev-parse', '--short=7', 'HEAD'], text=True).strip()
        sdk = subprocess.check_output(['git', '-C', str(wallet / 'sdk'), 'rev-parse', 'HEAD'], text=True).strip()
        ref = os.environ['SOURCE_REF']
        is_tag = subprocess.run(['git', '-C', str(wallet), 'show-ref', '--verify', '--quiet', 'refs/tags/' + ref]).returncode == 0
        safe_id = re.sub(r'[/\\:*?"<>|~^\s]', '-', ref) if is_tag else short
        extension = 'aab' if kind == 'appbundle' else 'apk'
        filename = f'gleec_wallet_android_{short}_{os.environ["BUILD_NUMBER"]}.{extension}'
        dist = root / 'dist'
        dist.mkdir()
        output = dist / filename
        shutil.copyfile(package, output)
        digest = hashlib.sha256(output.read_bytes()).hexdigest()
        (dist / (filename + '.sha256')).write_text(f'{digest}  {filename}\n')
        data = {'file':filename, 'sha256':digest, 'source_sha':sha, 'sdk_sha':sdk, 'builder_sha':os.environ['GITHUB_SHA'],
                'safe_id':safe_id, 'build_type':os.environ['BUILD_TYPE'], 'artifact_type':kind, 'build_number':int(os.environ['BUILD_NUMBER']),
                'application_id':manifest.get('package'), 'version_name':manifest.get(ns+'versionName'),
                'certificate_sha256':os.environ['ANDROID_CERT_SHA256'], 'signature_verified':True, 'abis':sorted(abis)}
        (dist / 'android-build.json').write_text(json.dumps(data, indent=2) + '\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write(f'\n### Verified Android {extension.upper()}\n\nFile: `{filename}`\n\nSHA-256: `{digest}`\n\n')
            summary.write(f'Application: `{data["application_id"]}`; versionCode: `{data["build_number"]}`; ABIs: `{", ".join(sorted(abis))}`.\n')
        PY
    - name: Upload verified Android package
      if: contains(fromJSON('["build","publish"]'), inputs.stage)
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: android-${{ inputs.artifact_type }}-${{ github.run_id }}
        path: ${{ env.ANDROID_RUN_DIR }}/dist/*
        if-no-files-found: error
        retention-days: 14
        overwrite: true
    - name: Remove isolated Android build and signing files
      if: always() && inputs.stage != 'diagnostics'
      run: |
        if [ -n "${ANDROID_RUN_DIR:-}" ]; then
          case "$ANDROID_RUN_DIR" in
            "$RUNNER_TEMP"/gleec-android.*) rm -rf -- "$ANDROID_RUN_DIR" ;;
            *) echo '::error::Unexpected Android temporary directory'; exit 1 ;;
          esac
        fi
    - name: Remove temporary Flutter SDK
      if: always() && inputs.stage != 'diagnostics'
      run: |
        if [ -n "${FLUTTER_INSTALL_DIR:-}" ]; then
          case "$FLUTTER_INSTALL_DIR" in
            "$RUNNER_TEMP"/gleec-flutter.*) rm -rf -- "$FLUTTER_INSTALL_DIR" ;;
            *) echo '::error::Unexpected Flutter temporary directory'; exit 1 ;;
          esac
        fi
    - name: Remove isolated wallet checkout
      if: always()
      run: |
        EXPECTED_DIR="$GITHUB_WORKSPACE/wallet-android-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        test "$WALLET_DIR" = "$EXPECTED_DIR"
        if [ -d "$WALLET_DIR" ]; then rm -rf -- "$WALLET_DIR"; fi
  publish_release:
    name: Publish verified Android package
    needs: build_android
    if: inputs.stage == 'publish' && github.event_name == 'workflow_dispatch' && github.repository == 'DeckerSU/gleec-wallet-builder'
      && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - name: Download this run's verified Android package
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: android-${{ inputs.artifact_type }}-${{ github.run_id }}
        path: dist
    - name: Validate artifact and publish Android assets
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_TYPE: ${{ inputs.build_type }}
        ARTIFACT_TYPE: ${{ inputs.artifact_type }}
        BUILD_NUMBER: ${{ inputs.build_number }}
      run: |
        python3 <<'PY'
        import hashlib, json, os, re, subprocess, urllib.error, urllib.parse, urllib.request
        from pathlib import Path

        root = Path('dist')
        manifest = json.loads((root / 'android-build.json').read_text())
        for field in ('source_sha', 'sdk_sha', 'builder_sha'):
            if not re.fullmatch(r'[0-9a-f]{40}', manifest.get(field, '')):
                raise SystemExit(f'Invalid {field} in build manifest')
        if manifest['builder_sha'] != os.environ['GITHUB_SHA']:
            raise SystemExit('Artifact was produced by a different workflow revision')
        build_type = os.environ['BUILD_TYPE']
        kind = os.environ['ARTIFACT_TYPE']
        number = os.environ['BUILD_NUMBER']
        if build_type not in ('debug', 'release') or manifest['build_type'] != build_type:
            raise SystemExit('Artifact build type does not match this dispatch')
        if kind not in ('appbundle', 'apk') or manifest['artifact_type'] != kind:
            raise SystemExit('Artifact format does not match this dispatch')
        if not re.fullmatch(r'[1-9][0-9]{0,9}', number) or int(number) > 2100000000 or manifest['build_number'] != int(number):
            raise SystemExit('Artifact build number does not match this dispatch')
        if manifest['signature_verified'] is not True or not re.fullmatch(r'[0-9a-f]{64}', manifest['certificate_sha256']):
            raise SystemExit('Artifact has no verified signing certificate')
        if manifest['application_id'] != 'com.gleec.gleecdex' or manifest['abis'] != ['arm64-v8a', 'armeabi-v7a']:
            raise SystemExit('Unexpected Android application ID or ABIs')
        extension = 'aab' if kind == 'appbundle' else 'apk'
        match = re.fullmatch(r'gleec_wallet_android_([0-9a-f]{7,40})_' + number + r'\.' + extension, manifest['file'])
        if not match or not manifest['source_sha'].startswith(match[1]):
            raise SystemExit('Package filename does not match its source, versionCode and format')
        package = root / manifest['file']
        checksum = root / (package.name + '.sha256')
        if package.is_symlink() or not package.is_file():
            raise SystemExit('Expected a regular Android package file')
        digest = hashlib.sha256(package.read_bytes()).hexdigest()
        if digest != manifest['sha256'] or checksum.read_text() != f'{digest}  {package.name}\n':
            raise SystemExit('Android package checksum verification failed')
        safe_id = manifest['safe_id']
        if not isinstance(safe_id, str) or not safe_id or re.search(r'[/\\\s\x00-\x1f\x7f]', safe_id):
            raise SystemExit('Invalid release identifier')
        tag = f'{build_type}_{safe_id}'
        subprocess.run(['git', 'check-ref-format', 'refs/tags/' + tag], check=True)
        # Never execute build artifact contents on the runner with release write access.
        public_manifest = root / (package.name + '.json')
        public_manifest.write_text(json.dumps(manifest, indent=2) + '\n')
        assets = [package, checksum, public_manifest]
        repo = os.environ['GITHUB_REPOSITORY']
        api = os.environ['GITHUB_API_URL'] + '/repos/' + repo
        headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                   'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}

        def request_json(path, missing_ok=False):
            request = urllib.request.Request(api + path, headers=headers)
            try:
                with urllib.request.urlopen(request, timeout=60) as response:
                    return json.load(response)
            except urllib.error.HTTPError as error:
                if missing_ok and error.code == 404:
                    return None
                raise

        release_path = '/releases/tags/' + urllib.parse.quote(tag, safe='')
        release = request_json(release_path, missing_ok=True)
        if release is None:
            notes = Path(os.environ['RUNNER_TEMP']) / 'android-release-notes.md'
            notes.write_text(
                f"Automated Android {build_type} build of GLEECBTC/gleec-wallet.\n\n"
                f"Source: [{manifest['source_sha']}](https://github.com/GLEECBTC/gleec-wallet/commit/{manifest['source_sha']})\n\n"
                f"Signed Android package; signature, application ID, versionCode and native ABIs verified.\n\n"
                f"SHA-256 checksums and build provenance accompany the Android package as separate assets.\n")
            result = subprocess.run(['gh', 'release', 'create', tag, '--repo', repo,
                                     '--target', os.environ['GITHUB_SHA'],
                                     '--title', f'Gleec Wallet {build_type} {safe_id}',
                                     '--notes-file', str(notes),
                                     '--prerelease' if build_type == 'debug' else '--latest'])
            # A concurrent desktop run may have created this release first.
            release = request_json(release_path, missing_ok=True)
            if release is None:
                raise SystemExit(f'Release creation failed (exit {result.returncode})')
        if release['draft'] or release['prerelease'] != (build_type == 'debug'):
            raise SystemExit('Existing release type does not match this build')
        if release.get('immutable'):
            raise SystemExit('Existing release is immutable; assets cannot be added')
        # Older desktop notes may have an empty commit because GitHub masked a job
        # output. When a complete source SHA is recorded, reject conflicting builds.
        recorded = re.findall(r'https://github\.com/GLEECBTC/gleec-wallet/(?:tree|commit)/([0-9a-f]{40})', release.get('body') or '')
        recorded += re.findall(r'\|\s*Commit\s*\|\s*`([0-9a-f]{40})`', release.get('body') or '')
        if any(sha != manifest['source_sha'] for sha in recorded):
            raise SystemExit('Existing release refers to a different wallet commit')
        existing = request_json(f"/releases/{release['id']}/assets?per_page=100")
        # Upload only explicitly named Android assets; preserve all other assets and notes.
        for asset in assets:
            expected = 'sha256:' + hashlib.sha256(asset.read_bytes()).hexdigest()
            previous = next((item for item in existing if item['name'] == asset.name), None)
            if previous and previous.get('digest') == expected:
                print(f'Already published with matching checksum: {asset.name}')
                continue
            subprocess.run(['gh', 'release', 'upload', tag, str(asset),
                            '--repo', repo, '--clobber'], check=True)
        # Download the published Android package again and verify the bytes served by Releases.
        verify_dir = Path(os.environ['RUNNER_TEMP']) / 'android-release-verification'
        verify_dir.mkdir(exist_ok=True)
        subprocess.run(['gh', 'release', 'download', tag, '--repo', repo,
                        '--pattern', package.name, '--dir', str(verify_dir), '--clobber'], check=True)
        if hashlib.sha256((verify_dir / package.name).read_bytes()).hexdigest() != digest:
            raise SystemExit('Published Android package checksum differs from the verified artifact')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write(f"### Published Android Android package\n\n[Release {tag}]({release['html_url']})\n\n")
            summary.write(f"File: `{package.name}`\n\nSHA-256: `{digest}`\n\n")
            summary.write('Downloaded release asset matches the verified Android package.\n')
        print(f"Published and verified: {release['html_url']}")
        PY
